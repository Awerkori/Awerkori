<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Project Nox — NΩΛ</title>
  <desc id="desc">Project Nox visual identity.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#06050a"/>
      <stop offset="0.58" stop-color="#0b0814"/>
      <stop offset="1" stop-color="#190b2b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop stop-color="#8b5cf6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#c4b5fd"/>
      <stop offset="0.7" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#c4b5fd" stroke-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="298" rx="17" fill="url(#grid)" stroke="#8b5cf6" stroke-opacity="0.28"/>
  <ellipse cx="510" cy="147" rx="330" ry="190" fill="url(#glow)"/>

  <g fill="none" stroke="#a78bfa" stroke-opacity="0.25">
    <circle cx="980" cy="148" r="87"/>
    <circle cx="980" cy="148" r="121"/>
    <circle cx="980" cy="148" r="157"/>
  </g>
  <g fill="#c4b5fd">
    <circle cx="980" cy="61" r="3"/>
    <circle cx="1098" cy="148" r="2"/>
    <circle cx="980" cy="305" r="3"/>
    <circle cx="864" cy="148" r="2"/>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="72" y="70" fill="#a78bfa" font-size="13" letter-spacing="5">NΩΛ</text>
    <text x="70" y="190" fill="#faf5ff" font-size="116" font-weight="700" letter-spacing="8">NΩΛ</text>
    <text x="78" y="231" fill="#e9d5ff" font-size="21" letter-spacing="6">PROJECT NOX</text>
    <text x="80" y="263" fill="#a78bfa" font-size="11" letter-spacing="3.5">BUILD THE CONNECTIONS</text>
  </g>

  <path d="M70 281H1130" stroke="url(#line)" stroke-width="2"/>
  <circle cx="600" cy="281" r="4" fill="#c4b5fd"/>
  <circle cx="600" cy="281" r="11" fill="none" stroke="#8b5cf6" stroke-opacity="0.35"/>
</svg>
