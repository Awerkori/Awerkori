<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Project Nox — NΩΛ</title>
  <desc id="desc">A dark violet system interface for the Project Nox ecosystem.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07060c"/>
      <stop offset="0.58" stop-color="#0c0917"/>
      <stop offset="1" stop-color="#160c25"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="0.24" stop-color="#a78bfa"/>
      <stop offset="0.76" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="48%" r="55%">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.18"/>
      <stop offset="0.65" stop-color="#5b21b6" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#5b21b6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#c4b5fd" stroke-opacity="0.055"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="358" rx="17" fill="url(#grid)" stroke="#8b5cf6" stroke-opacity="0.28"/>
  <ellipse cx="610" cy="174" rx="330" ry="190" fill="url(#halo)"/>

  <g fill="none" stroke="#a78bfa" stroke-opacity="0.22">
    <path d="M820 70c104 32 164 94 164 151s-60 119-164 151"/>
    <path d="M862 44c135 46 211 111 211 177s-76 131-211 177"/>
    <path d="M927 27c106 65 157 126 157 194s-51 129-157 194"/>
  </g>
  <g fill="#c4b5fd">
    <circle cx="923" cy="99" r="3"/>
    <circle cx="1032" cy="157" r="2" opacity="0.8"/>
    <circle cx="972" cy="282" r="3"/>
    <circle cx="1090" cy="220" r="2" opacity="0.6"/>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" fill="#e9d5ff">
    <text x="70" y="72" font-size="14" letter-spacing="4" fill="#a78bfa">PROJECT / NOX</text>
    <text x="70" y="103" font-size="11" letter-spacing="2.5" fill="#71717a">SYSTEM SIGNAL 01  ·  ECOSYSTEM PROFILE</text>
    <text x="70" y="232" font-size="146" font-weight="700" letter-spacing="10" fill="#faf5ff">NΩΛ</text>
    <text x="78" y="276" font-size="18" letter-spacing="5" fill="#c4b5fd">ONE SYSTEM · MANY SURFACES</text>
    <text x="78" y="315" font-size="11" letter-spacing="2.4" fill="#71717a">WEB  /  NETWORK  /  TOOLS  /  OPERATIONS</text>
  </g>

  <path d="M70 337H1130" stroke="url(#edge)" stroke-width="2"/>
  <path d="M70 337h84M1046 337h84" stroke="#f5f3ff" stroke-opacity="0.5"/>
  <circle cx="600" cy="337" r="4" fill="#c4b5fd"/>
  <circle cx="600" cy="337" r="11" fill="none" stroke="#8b5cf6" stroke-opacity="0.35"/>
</svg>
