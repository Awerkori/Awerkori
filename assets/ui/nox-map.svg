<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Project Nox ecosystem map</title>
  <desc id="desc">Project Nox connects web, distribution, tools, operations and community nodes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#09070f"/>
      <stop offset="1" stop-color="#140b22"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#6d28d9" stop-opacity="0.25"/>
      <stop offset="0.5" stop-color="#c4b5fd" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#6d28d9" stop-opacity="0.25"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#c4b5fd" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="298" rx="15" fill="url(#grid)" stroke="#8b5cf6" stroke-opacity="0.24"/>

  <g fill="none" stroke="url(#wire)" stroke-width="1.5">
    <path d="M160 77H405L493 139"/>
    <path d="M160 223H405L493 161"/>
    <path d="M1040 77H795L707 139"/>
    <path d="M1040 223H795L707 161"/>
  </g>
  <g fill="#c4b5fd">
    <circle cx="405" cy="77" r="3"/><circle cx="405" cy="223" r="3"/>
    <circle cx="795" cy="77" r="3"/><circle cx="795" cy="223" r="3"/>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <g fill="#0f0a1b" stroke="#8b5cf6" stroke-opacity="0.55">
      <rect x="48" y="48" width="224" height="58" rx="10"/>
      <rect x="48" y="194" width="224" height="58" rx="10"/>
      <rect x="928" y="48" width="224" height="58" rx="10"/>
      <rect x="928" y="194" width="224" height="58" rx="10"/>
    </g>
    <g fill="#c4b5fd" font-size="11" letter-spacing="2.8">
      <text x="72" y="73">WEB / PRODUCT</text>
      <text x="72" y="93" fill="#71717a" letter-spacing="1.2">project-nox-manga</text>
      <text x="72" y="219">NETWORK / REQUESTS</text>
      <text x="72" y="239" fill="#71717a" letter-spacing="1.2">tracker · requests</text>
      <text x="952" y="73">DISTRIBUTION</text>
      <text x="952" y="93" fill="#71717a" letter-spacing="1.2">source · compiled nodes</text>
      <text x="952" y="219">TOOLS / OPERATIONS</text>
      <text x="952" y="239" fill="#71717a" letter-spacing="1.2">importer · scan staff</text>
    </g>
  </g>

  <g transform="translate(600 150)">
    <circle r="73" fill="#0e0919" stroke="#8b5cf6" stroke-opacity="0.3"/>
    <circle r="57" fill="none" stroke="#c4b5fd" stroke-opacity="0.18" stroke-dasharray="2 7"/>
    <path d="M-73 0H73M0-73V73" stroke="#c4b5fd" stroke-opacity="0.08"/>
    <text y="13" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="35" font-weight="700" letter-spacing="2" fill="#faf5ff">NΩΛ</text>
  </g>
</svg>
