<svg xmlns="http://www.w3.org/2000/svg" width="420" height="172" viewBox="0 0 420 172" role="img" aria-labelledby="animeMobTitle">
  <title id="animeMobTitle">Project Nox · Anime</title>
  <defs>
    <linearGradient id="animeBgM" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e0a19"/>
      <stop offset="50%" stop-color="#140c24"/>
      <stop offset="100%" stop-color="#090612"/>
    </linearGradient>
    <linearGradient id="animeBtnM" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff099"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <style>
    
  text {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

    .badge-label-m {
      font-size: 8.5px;
      font-weight: 700;
      letter-spacing: 1.8px;
      fill: #fbbf24;
    }
    .card-title-m {
      font-family: "Cinzel", Georgia, serif;
      font-size: 18.5px;
      font-weight: 700;
      fill: #ffffff;
    }
    .card-desc-m {
      font-size: 11px;
      line-height: 15px;
      fill: #c4b5fd;
    }
    .repos-sub-m {
      font-size: 9.5px;
      font-weight: 600;
      fill: #e9d5ff;
    }
    .btn-text-m {
      font-size: 11px;
      font-weight: 700;
      fill: #090610;
    }
  </style>

  <rect x="0.5" y="0.5" width="419" height="171" rx="12" fill="url(#animeBgM)" stroke="#3e2063" stroke-width="1"/>
  <path d="M12 1H120" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>

  <g transform="translate(18, 18)">
    <text x="0" y="6" class="badge-label-m">✦ EXTENSÕES · ANIYOMI E FORKS</text>
    <text x="0" y="27" class="card-title-m">Project Nox · Anime</text>
    <text x="0" y="46" class="card-desc-m">Extensões para Aniyomi e forks com catálogo compilado para streaming.</text>
    <text x="0" y="66" class="repos-sub-m">Distribuição: anime-extensoes · Fonte: anime-fonte-extensoes</text>

    <!-- Full-width Mobile CTA Button -->
    <g transform="translate(0, 84)">
      <rect x="0" y="0" width="384" height="36" rx="8" fill="url(#animeBtnM)"/>
      <text x="192" y="23" class="btn-text-m" text-anchor="middle">Acessar Projeto →</text>
    </g>
  </g>
</svg>
