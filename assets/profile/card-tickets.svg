<svg xmlns="http://www.w3.org/2000/svg" width="846" height="132" viewBox="0 0 846 132" role="img" aria-labelledby="ticketsTitle ticketsDesc">
  <title id="ticketsTitle">Project Nox · Tickets</title>
  <desc id="ticketsDesc">Reporte problemas em extensões de mangá e anime e envie solicitações.</desc>
  <defs>
    <linearGradient id="ticketsBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e0a19"/>
      <stop offset="50%" stop-color="#140c24"/>
      <stop offset="100%" stop-color="#090612"/>
    </linearGradient>
    <radialGradient id="ticketsGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0e0a19" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ticketsBorderGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#7c3aed" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#3e2063" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <style>
    
  text {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

    .badge-label {
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 2px;
      fill: #fbbf24;
    }
    .card-title {
      font-family: "Cinzel", Georgia, serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.2px;
      fill: #ffffff;
    }
    .card-desc {
      font-size: 13px;
      fill: #c4b5fd;
      line-height: 19px;
    }
    .tag-text {
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.5px;
      fill: #fef08a;
    }
    .halo-pulse {
      animation: iconBreath 6s ease-in-out infinite alternate;
    }
    @keyframes iconBreath {
      0% { opacity: 0.35; }
      100% { opacity: 0.85; }
    }
    @media (prefers-reduced-motion: reduce) {
      .halo-pulse { animation: none !important; }
    }
  </style>

  <!-- Surface with subtle gradient border -->
  <rect x="0.5" y="0.5" width="845" height="131" rx="14" fill="url(#ticketsBg)" stroke="url(#ticketsBorderGrad)" stroke-width="1"/>
  <!-- Glowing accent bar -->
  <path d="M14 1H180" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>

  <!-- Left Icon Frame (Exact Center at 65, 66) -->
  <g transform="translate(26, 17)">
    <circle cx="49" cy="49" r="44" fill="url(#ticketsGlow)" class="halo-pulse"/>
    <rect x="10" y="10" width="78" height="78" rx="16" fill="#1b112e" stroke="#522785" stroke-width="1.2"/>
    <g transform="translate(10, 10)">
      
    <!-- Centered Ticket / Compass Glyph -->
    <rect x="18" y="25" width="42" height="28" rx="5" fill="#2d174d" stroke="#fbbf24" stroke-width="1.5"/>
    <line x1="30" y1="25" x2="30" y2="53" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="3 3"/>
    <!-- Center Star -->
    <path d="M44 34l1.5 3.5 3.5.5-2.5 2.5.5 3.5-3-1.8-3 1.8.5-3.5-2.5-2.5 3.5-.5z" fill="#fbbf24"/>
    <circle cx="18" cy="39" r="3.5" fill="#1b112e"/>
    <circle cx="60" cy="39" r="3.5" fill="#1b112e"/>
  
    </g>
  </g>

  // Central Content
  <g transform="translate(136, 26)">
    <text x="0" y="8" class="badge-label">✦ CENTRAL DE ATENDIMENTO E PEDIDOS</text>
    <text x="0" y="34" class="card-title">Project Nox · Tickets</text>
    <text x="0" y="60" class="card-desc">Reporte problemas em extensões de mangá e anime e envie solicitações.</text>
  </g>

  <!-- Right Decorative Tag Badge -->
  <g transform="translate(680, 47)">
    <rect x="0" y="0" width="138" height="36" rx="9" fill="#190f2d" stroke="#4c277a" stroke-width="1"/>
    <text x="69" y="23" class="tag-text" text-anchor="middle">✦ Suporte &amp; Pedidos</text>
  </g>
</svg>
