<svg xmlns="http://www.w3.org/2000/svg" width="160" height="36" viewBox="0 0 160 36" role="img" aria-label="Abrir ticket">
  <defs>
    <linearGradient id="btnTicketsOpenBtnBg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#21123d"/>
        <stop offset="50%" stop-color="#2a144e"/>
        <stop offset="100%" stop-color="#190d2e"/>
      </linearGradient>
    <linearGradient id="btnTicketsOpenBtnBorder" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.85"/>
        <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.6"/>
      </linearGradient>
  </defs>
  <style>
    
  text {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

    .btn-lbl {
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.2px;
      fill: #ffffff;
    }
  </style>
  <rect x="0.5" y="0.5" width="159" height="35" rx="8" fill="url(#btnTicketsOpenBtnBg)" stroke="url(#btnTicketsOpenBtnBorder)" stroke-width="1"/>
  <path d="M10 2H150" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" stroke-linecap="round"/>

  <!-- Left Icon -->
  <g transform="translate(12, 9)">
    <rect x="1" y="3" width="16" height="12" rx="2" fill="none" stroke="#fbbf24" stroke-width="1.4"/><line x1="6" y1="3" x2="6" y2="15" stroke="#fbbf24" stroke-width="1" stroke-dasharray="2 2"/><circle cx="11" cy="9" r="1.8" fill="#fbbf24"/>
  </g>

  <!-- Button Label -->
  <text x="34" y="23" class="btn-lbl">Abrir ticket</text>

  <!-- Right Chevron -->
  <g transform="translate(142, 13)">
    <path d="M0 0l3.5 4.5-3.5 4.5" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
