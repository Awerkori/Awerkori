      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="goldTextM" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glowGoldM" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .label-badge {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1.8px;
      fill: #c4b5fd;
    }
    .big-num {
      font-family: "Cinzel", Georgia, serif;
      font-size: 28px;
      font-weight: 700;
      fill: url(#goldTextM);
    }
    .stat-sub {
      font-size: 11px;
      fill: #a78bfa;
    }
    .meta-text {
      font-size: 9.5px;
      fill: #8b859e;
    }
    .gold-highlight {
      fill: #fbbf24;
      font-weight: 600;
    }
    .pulse-dot {
      animation: liveDot 2.4s ease-in-out infinite;
      transform-origin: center;
    }
    .pulse-ring {
      animation: liveRing 2.4s cubic-bezier(0.2, 0.8, 0.4, 1) infinite;
      transform-origin: center;
    }
    @keyframes liveDot {
      0%, 100% { transform: scale(1); opacity: 0.95; }
      50% { transform: scale(1.3); opacity: 0.6; }
    }
    @keyframes liveRing {
      0% { transform: scale(0.6); opacity: 0.9; }
      100% { transform: scale(2.2); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .pulse-dot, .pulse-ring { animation: none !important; }
    }
  </style>

