<svg xmlns="http://www.w3.org/2000/svg" width="846" height="132" viewBox="0 0 846 132" role="img" aria-labelledby="siteTitle siteDesc">
  <title id="siteTitle">Project Nox · Site</title>
  <desc id="siteDesc">Portal oficial do Project Nox para catálogo e leitura de obras.</desc>
  <defs>
    <linearGradient id="siteBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e0a19"/>
      <stop offset="50%" stop-color="#140c24"/>
      <stop offset="100%" stop-color="#090612"/>
    </linearGradient>
    <radialGradient id="siteGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0e0a19" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="siteBorderGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#7c3aed" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#3e2063" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <style>
    
  text {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

    .badge-label {
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 2px;
      fill: #fbbf24;
    }
    .card-title {
      font-family: "Cinzel", Georgia, serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.2px;
      fill: #ffffff;
    }
    .card-desc {
      font-size: 13px;
      fill: #c4b5fd;
      line-height: 19px;
    }
    .tag-text {
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.5px;
      fill: #fef08a;
    }
    .halo-pulse {
      animation: iconBreath 6s ease-in-out infinite alternate;
    }
    @keyframes iconBreath {
      0% { opacity: 0.35; }
      100% { opacity: 0.85; }
    }
    @media (prefers-reduced-motion: reduce) {
      .halo-pulse { animation: none !important; }
    }
  </style>

  <!-- Surface with subtle gradient border -->
  <rect x="0.5" y="0.5" width="845" height="131" rx="14" fill="url(#siteBg)" stroke="url(#siteBorderGrad)" stroke-width="1"/>
  <!-- Glowing accent bar -->
  <path d="M14 1H180" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>

  <!-- Left Icon Frame (Exact Center at 65, 66) -->
  <g transform="translate(26, 17)">
    <circle cx="49" cy="49" r="44" fill="url(#siteGlow)" class="halo-pulse"/>
    <rect x="10" y="10" width="78" height="78" rx="16" fill="#1b112e" stroke="#522785" stroke-width="1.2"/>
    <g transform="translate(10, 10)">
      
    <!-- Cosmic Globe / Portal Glyph -->
    <circle cx="39" cy="39" r="22" fill="#24133f" stroke="#7c3aed" stroke-width="1.4"/>
    <ellipse cx="39" cy="39" rx="10" ry="22" fill="none" stroke="#a855f7" stroke-width="1.1"/>
    <line x1="17" y1="39" x2="61" y2="39" stroke="#fbbf24" stroke-width="1.3"/>
    <ellipse cx="39" cy="39" rx="26" ry="7" fill="none" stroke="#fbbf24" stroke-width="0.9" opacity="0.6" transform="rotate(-20 39 39)"/>
  
    </g>
  </g>

  // Central Content
  <g transform="translate(136, 26)">
    <text x="0" y="8" class="badge-label">✦ PORTAL OFICIAL · WEB E CATÁLOGO</text>
    <text x="0" y="34" class="card-title">Project Nox · Site</text>
    <text x="0" y="60" class="card-desc">Portal oficial do Project Nox para catálogo e leitura de obras.</text>
  </g>

  <!-- Right Decorative Tag Badge -->
  <g transform="translate(680, 47)">
    <rect x="0" y="0" width="138" height="36" rx="9" fill="#190f2d" stroke="#4c277a" stroke-width="1"/>
    <text x="69" y="23" class="tag-text" text-anchor="middle">✦ Site Oficial</text>
  </g>
</svg>
