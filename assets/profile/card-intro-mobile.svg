<svg xmlns="http://www.w3.org/2000/svg" width="420" height="134" viewBox="0 0 420 134" role="img" aria-labelledby="introMobTitle">
  <title id="introMobTitle">Awerkori — Fundador do Project Nox</title>
  <defs>
    <linearGradient id="introBgM" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0818"/>
      <stop offset="55%" stop-color="#130b22"/>
      <stop offset="100%" stop-color="#090612"/>
    </linearGradient>
  </defs>
  <style>
    
  text {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

    .intro-kicker-m {
      font-size: 8.5px;
      font-weight: 700;
      letter-spacing: 2px;
      fill: #fbbf24;
    }
    .intro-lead-m {
      font-size: 12px;
      font-weight: 500;
      fill: #f3e8ff;
    }
    .intro-sub-m {
      font-size: 11px;
      font-weight: 400;
