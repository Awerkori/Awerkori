<svg xmlns="http://www.w3.org/2000/svg" width="846" height="132" viewBox="0 0 846 132" role="img" aria-labelledby="mangaTitle mangaDesc">
  <title id="mangaTitle">Project Nox · Mangá</title>
  <desc id="mangaDesc">Extensões compiladas para Mihon e forks, com foco em estabilidade e fontes em português.</desc>
  <defs>
    <linearGradient id="mangaBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e0a19"/>
      <stop offset="50%" stop-color="#140c24"/>
      <stop offset="100%" stop-color="#090612"/>
    </linearGradient>
    <radialGradient id="mangaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0e0a19" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mangaBorderGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#7c3aed" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#3e2063" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <style>
    
  text {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

    .badge-label {
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 2px;
      fill: #fbbf24;
    }
    .card-title {
      font-family: "Cinzel", Georgia, serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.2px;
      fill: #ffffff;
    }
    .card-desc {
      font-size: 13px;
      fill: #c4b5fd;
      line-height: 19px;
    }
    .tag-text {
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.5px;
      fill: #fef08a;
    }
    .halo-pulse {
      animation: iconBreath 6s ease-in-out infinite alternate;
    }
    @keyframes iconBreath {
      0% { opacity: 0.35; }
      100% { opacity: 0.85; }
    }
    @media (prefers-reduced-motion: reduce) {
      .halo-pulse { animation: none !important; }
    }
  </style>

  <!-- Surface with subtle gradient border -->
  <rect x="0.5" y="0.5" width="845" height="131" rx="14" fill="url(#mangaBg)" stroke="url(#mangaBorderGrad)" stroke-width="1"/>
  <!-- Glowing accent bar -->
  <path d="M14 1H180" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>

  <!-- Left Icon Frame (Exact Center at 65, 66) -->
  <g transform="translate(26, 17)">
    <circle cx="49" cy="49" r="44" fill="url(#mangaGlow)" class="halo-pulse"/>
    <rect x="10" y="10" width="78" height="78" rx="16" fill="#1b112e" stroke="#522785" stroke-width="1.2"/>
    <g transform="translate(10, 10)">
      
    <!-- Glowing Open Book Glyph -->
    <path d="M19 23c7-3 15-3 20 2v34c-5-4-13-4-20-2z" fill="#2d174d" stroke="#a855f7" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M59 23c-7-3-15-3-20 2v34c5-4 13-4 20-2z" fill="#2d174d" stroke="#a855f7" stroke-width="1.6" stroke-linejoin="round"/>
    <line x1="39" y1="25" x2="39" y2="59" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    <line x1="24" y1="31" x2="34" y2="29" stroke="#e9d5ff" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="24" y1="38" x2="34" y2="36" stroke="#e9d5ff" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="44" y1="29" x2="54" y2="31" stroke="#e9d5ff" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="44" y1="36" x2="54" y2="38" stroke="#e9d5ff" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="39" cy="18" r="2" fill="#fbbf24"/>
  
    </g>
  </g>

  // Central Content
  <g transform="translate(136, 26)">
    <text x="0" y="8" class="badge-label">✦ EXTENSÕES DE MANGÁ · MIHON E FORKS</text>
    <text x="0" y="34" class="card-title">Project Nox · Mangá</text>
    <text x="0" y="60" class="card-desc">Extensões compiladas para Mihon e forks, com foco em estabilidade e fontes em português.</text>
  </g>

  <!-- Right Decorative Tag Badge -->
  <g transform="translate(680, 47)">
    <rect x="0" y="0" width="138" height="36" rx="9" fill="#190f2d" stroke="#4c277a" stroke-width="1"/>
    <text x="69" y="23" class="tag-text" text-anchor="middle">✦ Mihon e forks</text>
  </g>
</svg>
