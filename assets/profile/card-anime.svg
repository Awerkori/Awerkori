<svg xmlns="http://www.w3.org/2000/svg" width="846" height="132" viewBox="0 0 846 132" role="img" aria-labelledby="animeTitle animeDesc">
  <title id="animeTitle">Project Nox · Anime</title>
  <desc id="animeDesc">Extensões compiladas para Aniyomi e forks, com catálogo pronto para streaming contínuo.</desc>
  <defs>
    <linearGradient id="animeBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e0a19"/>
      <stop offset="50%" stop-color="#140c24"/>
      <stop offset="100%" stop-color="#090612"/>
    </linearGradient>
    <radialGradient id="animeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0e0a19" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="animeBorderGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#7c3aed" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#3e2063" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <style>
    
  text {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

    .badge-label {
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 2px;
      fill: #fbbf24;
    }
    .card-title {
      font-family: "Cinzel", Georgia, serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.2px;
      fill: #ffffff;
    }
    .card-desc {
      font-size: 13px;
      fill: #c4b5fd;
      line-height: 19px;
    }
    .tag-text {
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.5px;
      fill: #fef08a;
    }
    .halo-pulse {
      animation: iconBreath 6s ease-in-out infinite alternate;
    }
    @keyframes iconBreath {
      0% { opacity: 0.35; }
      100% { opacity: 0.85; }
    }
    @media (prefers-reduced-motion: reduce) {
      .halo-pulse { animation: none !important; }
    }
  </style>

  <!-- Surface with subtle gradient border -->
  <rect x="0.5" y="0.5" width="845" height="131" rx="14" fill="url(#animeBg)" stroke="url(#animeBorderGrad)" stroke-width="1"/>
  <!-- Glowing accent bar -->
  <path d="M14 1H180" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>

  <!-- Left Icon Frame (Exact Center at 65, 66) -->
  <g transform="translate(26, 17)">
    <circle cx="49" cy="49" r="44" fill="url(#animeGlow)" class="halo-pulse"/>
    <rect x="10" y="10" width="78" height="78" rx="16" fill="#1b112e" stroke="#522785" stroke-width="1.2"/>
    <g transform="translate(10, 10)">
      
    <!-- Stable Center Anime Play Glyph -->
    <circle cx="39" cy="39" r="26" fill="none" stroke="#7c3aed" stroke-width="1.4" stroke-dasharray="7 5"/>
    <circle cx="39" cy="39" r="18" fill="#2d174d" stroke="#fbbf24" stroke-width="1.4"/>
    <path d="M35 30l13 9-13 9z" fill="#fbbf24"/>
    <circle cx="39" cy="13" r="1.5" fill="#fef08a"/>
    <circle cx="65" cy="39" r="1.5" fill="#c084fc"/>
  
    </g>
  </g>

  // Central Content
  <g transform="translate(136, 26)">
    <text x="0" y="8" class="badge-label">✦ EXTENSÕES DE ANIME · ANIYOMI E FORKS</text>
    <text x="0" y="34" class="card-title">Project Nox · Anime</text>
    <text x="0" y="60" class="card-desc">Extensões compiladas para Aniyomi e forks, com catálogo pronto para streaming contínuo.</text>
  </g>

  <!-- Right Decorative Tag Badge -->
  <g transform="translate(680, 47)">
    <rect x="0" y="0" width="138" height="36" rx="9" fill="#190f2d" stroke="#4c277a" stroke-width="1"/>
    <text x="69" y="23" class="tag-text" text-anchor="middle">✦ Aniyomi e forks</text>
  </g>
</svg>
