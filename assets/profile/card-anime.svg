<svg xmlns="http://www.w3.org/2000/svg" width="846" height="104" viewBox="0 0 846 104" role="img" aria-labelledby="animeTitle animeDesc">
  <title id="animeTitle">Project Nox · Anime</title>
  <desc id="animeDesc">Extensões compiladas para Aniyomi e forks com streaming contínuo.</desc>
  <defs>
    <linearGradient id="animeBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e0a19"/>
      <stop offset="50%" stop-color="#140c24"/>
      <stop offset="100%" stop-color="#090612"/>
    </linearGradient>
    <radialGradient id="animeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0e0a19" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="animeBorderGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#7c3aed" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#3e2063" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <style>
    
  text {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

    .badge-label {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 2px;
      fill: #fbbf24;
    }
    .card-title {
      font-family: "Cinzel", Georgia, serif;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.2px;
      fill: #ffffff;
    }
    .card-desc {
      font-size: 12.5px;
      fill: #c4b5fd;
    }
    .tag-text {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.5px;
      fill: #fef08a;
    }
    .halo-pulse {
      animation: iconBreath 6s ease-in-out infinite alternate;
    }
    @keyframes iconBreath {
      0% { opacity: 0.35; }
      100% { opacity: 0.85; }
    }
    @media (prefers-reduced-motion: reduce) {
      .halo-pulse { animation: none !important; }
    }
  </style>

  <!-- Surface with subtle gradient border -->
  <rect x="0.5" y="0.5" width="845" height="103" rx="12" fill="url(#animeBg)" stroke="url(#animeBorderGrad)" stroke-width="1"/>
  <!-- Glowing accent bar -->
  <path d="M14 1H150" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>

  <!-- Left Icon Frame (Compact: 64x64 at 20, 20) -->
  <g transform="translate(20, 16)">
    <circle cx="36" cy="36" r="32" fill="url(#animeGlow)" class="halo-pulse"/>
    <rect x="4" y="4" width="64" height="64" rx="14" fill="#1b112e" stroke="#522785" stroke-width="1.1"/>
    <g transform="translate(-3, -3)">
      
    <circle cx="39" cy="39" r="26" fill="none" stroke="#7c3aed" stroke-width="1.4" stroke-dasharray="7 5"/>
    <circle cx="39" cy="39" r="18" fill="#2d174d" stroke="#fbbf24" stroke-width="1.4"/>
    <path d="M35 30l13 9-13 9z" fill="#fbbf24"/>
    <circle cx="39" cy="13" r="1.5" fill="#fef08a"/>
    <circle cx="65" cy="39" r="1.5" fill="#c084fc"/>
  
    </g>
  </g>

  <!-- Central Content -->
  <g transform="translate(108, 22)">
    <text x="0" y="8" class="badge-label">✦ EXTENSÕES DE ANIME · ANIYOMI E FORKS</text>
    <text x="0" y="32" class="card-title">Project Nox · Anime</text>
    <text x="0" y="54" class="card-desc">Extensões compiladas para Aniyomi e forks com streaming contínuo.</text>
  </g>

  <!-- Right Decorative Tag Badge -->
  <g transform="translate(685, 36)">
    <rect x="0" y="0" width="135" height="32" rx="8" fill="#190f2d" stroke="#4c277a" stroke-width="0.9"/>
    <text x="67" y="21" class="tag-text" text-anchor="middle">✦ Aniyomi e forks</text>
  </g>
</svg>
