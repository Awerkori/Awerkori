<svg xmlns="http://www.w3.org/2000/svg" width="846" height="88" viewBox="0 0 846 88" role="img" aria-labelledby="aboutTitle aboutDesc">
  <title id="aboutTitle">Mais sobre mim — canais e redes pessoais de Awerkori</title>
  <desc id="aboutDesc">Acesso ao agregador de links pessoais, redes sociais, comunidades e demais canais de Awerkori fora do GitHub.</desc>
  <defs>
    <linearGradient id="aboutBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f091c"/>
      <stop offset="50%" stop-color="#150d26"/>
      <stop offset="100%" stop-color="#0a0614"/>
    </linearGradient>
    <radialGradient id="aboutGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0f091c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aboutBtnBorder" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#6b21a8" stop-opacity="0.75"/>
    </linearGradient>
  </defs>

  <style>
    
  text {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

    .badge-about {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 2px;
      fill: #fbbf24;
    }
    .about-title {
      font-family: "Cinzel", Georgia, serif;
      font-size: 19px;
      font-weight: 700;
      fill: #ffffff;
    }
    .about-desc {
      font-size: 13px;
      fill: #d4c6f7;
    }
    .btn-about-text {
      font-size: 12.5px;
      font-weight: 600;
      fill: #fef08a;
      letter-spacing: 0.2px;
    }
  </style>

  <rect x="0.5" y="0.5" width="845" height="87" rx="12" fill="url(#aboutBg)" stroke="#3e2063" stroke-width="1"/>
  <path d="M14 1H120" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>

  <!-- Icon (Compact) -->
  <g transform="translate(20, 12)">
    <circle cx="32" cy="32" r="28" fill="url(#aboutGlow)"/>
    <rect x="5" y="5" width="54" height="54" rx="12" fill="#1b112e" stroke="#522785" stroke-width="1.1"/>
    <g transform="translate(-7, -7)">
      
    <circle cx="39" cy="39" r="22" fill="#24133f" stroke="#7c3aed" stroke-width="1.4"/>
    <path d="M39 22v34M22 39h34" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M39 29l2.5 7 7 2.5-7 2.5-2.5 7-2.5-7-7-2.5 7-2.5z" fill="#facc15"/>
    <circle cx="39" cy="39" r="1.8" fill="#ffffff"/>
  
    </g>
  </g>

  <!-- Text -->
  <g transform="translate(100, 18)">
    <text x="0" y="8" class="badge-about">✦ PERFIL PESSOAL · ALÉM DO GITHUB</text>
    <text x="0" y="31" class="about-title">Mais sobre mim</text>
    <text x="0" y="52" class="about-desc">Minhas redes sociais, comunidades e outros canais em um só lugar.</text>
  </g>

  <!-- Right Action Button -->
  <g transform="translate(680, 26)">
    <rect x="0" y="0" width="140" height="36" rx="8" fill="#1c1130" stroke="url(#aboutBtnBorder)" stroke-width="1"/>
    <text x="61" y="22.5" class="btn-about-text" text-anchor="middle">Acessar</text>
    <path d="M98 14l3.5 4-3.5 4" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
